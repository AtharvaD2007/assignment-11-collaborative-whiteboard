<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collaborative Whiteboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="join-overlay" class="overlay">
    <div class="join-card">
      <h1>🎨 Collaborative Whiteboard</h1>
      <p class="subtitle">Draw together in real time.</p>

      <label for="board-input">Board ID</label>
      <input id="board-input" type="text" placeholder="e.g. DESIGN_101" />

      <label for="name-input">Your name</label>
      <input id="name-input" type="text" placeholder="e.g. Alice" maxlength="20" />

      <button id="join-btn">Join Board</button>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="toolbar">
      <div class="toolbar-group">
        <span class="board-label">Board: <strong id="board-name-label"></strong></span>
        <span id="connection-dot" class="dot dot-offline" title="Connection status"></span>
      </div>

      <div class="toolbar-group">
        <label class="tool-label">Color
          <input id="brush-color" type="color" value="#000000" />
        </label>
        <label class="tool-label">Size
          <input id="brush-size" type="range" min="1" max="30" value="4" />
        </label>
        <button id="undo-btn" class="btn btn-secondary" title="Undo last stroke">↩ Undo</button>
        <button id="clear-btn" class="btn btn-danger" title="Clear board for everyone">🗑 Clear</button>
      </div>

      <div class="toolbar-group">
        <div id="user-list" class="user-list"></div>
      </div>
    </header>

    <main class="canvas-wrap">
      <canvas id="board-canvas"></canvas>
      <div id="cursor-layer"></div>
      <div id="toast" class="toast hidden"></div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
